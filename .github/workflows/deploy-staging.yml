name: Deploy Staging

on:
  push:
    branches: [main, master]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-staging
          path: dist/
          retention-days: 3

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-staging
          path: dist/
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          # Replace with your actual deploy command:
          # - rsync: rsync -avz dist/ user@staging-server:/var/www/app/
          # - Railway: railway deploy
          # - Render: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
          # - Fly.io: flyctl deploy --remote-only
          echo "Deploy script not configured. Add your deploy command here."
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run smoke tests against staging
        run: |
          STAGING_URL="${{ vars.STAGING_URL }}"
          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_URL not set — skipping smoke tests"
            exit 0
          fi
          # Basic health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/health" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "Health check FAILED (HTTP $HTTP_STATUS)"
            exit 1
          fi
        env:
          NODE_ENV: staging
