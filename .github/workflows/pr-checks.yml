name: PR Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check PR title follows Conventional Commits
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|chore|docs|test|refactor|style|perf|ci|build|revert)(\(.+\))?: .+"
          if echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "ERROR: PR title does not follow Conventional Commits format"
            echo "Expected: feat|fix|chore|docs|test|refactor: description"
            echo "Got: $PR_TITLE"
            exit 1
          fi

  pr-size:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          LINES=$(git diff --stat "$BASE" "$HEAD" 2>/dev/null | tail -1 | grep -o '[0-9]* insertion' | grep -o '[0-9]*' || echo 0)
          echo "Lines changed: $LINES"
          if [ "$LINES" -gt 600 ]; then
            echo "WARNING: This PR changes $LINES lines. Consider splitting into smaller PRs (recommended max: 400)."
          else
            echo "PR size OK ($LINES lines)"
          fi

  label:
    name: Auto Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
        continue-on-error: true

  no-direct-main:
    name: Block Direct Push to Main
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master'
    steps:
      - name: Check branch name
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
            echo "ERROR: Direct push to main/master is not allowed. Use a feature branch."
            exit 1
          fi
          echo "Branch OK: $BRANCH"
