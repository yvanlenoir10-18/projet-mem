name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci-only
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ needs.build.outputs.version }}
          path: dist/
      - name: Create release archive
        run: zip -r release-${{ needs.build.outputs.version }}.zip dist/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-${{ needs.build.outputs.version }}.zip
          fail_on_unmatched_files: false

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, github-release]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-build-${{ needs.build.outputs.version }}
          path: dist/
      - name: Deploy to production
        run: |
          echo "Deploying version ${{ needs.build.outputs.version }} to production..."
          # Replace with your actual production deploy command
          echo "Deploy script not configured. Add your production deploy command here."
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
      - name: Production health check
        run: |
          PROD_URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$PROD_URL" ]; then
            echo "PRODUCTION_URL not set — skipping health check"
            exit 0
          fi
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/health" || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Production health check passed"
          else
            echo "Production health check FAILED (HTTP $HTTP_STATUS)"
            exit 1
          fi
