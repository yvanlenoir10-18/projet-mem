{% extends 'base.html' %}
{% block title %}Connexion{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-body p-4">
                <h4 class="card-title text-center mb-4">
                    <i class="bi bi-tree-fill text-success"></i><br>
                    CUF Pilotage<br>
                    <small class="text-muted fs-6">Scierie Ebolowa — Chaîne 4</small>
                </h4>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control"
                               placeholder="votre@email.cm" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Se connecter
                    </button>
                </form>
                <hr>
                <small class="text-muted d-block text-center">
                    Comptes de démonstration :<br>
                    saisie@cuf.cm / chef@cuf.cm / pdg@cuf.cm<br>
                    Mot de passe : <strong>cuf2026</strong>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
