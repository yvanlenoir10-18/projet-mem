<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page introuvable · Wood_Pilot_Ebolowa</title>
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="wp-error-page">
  <div style="max-width:480px;padding:2rem;">

    <div style="display:flex;justify-content:center;margin-bottom:2rem;">
      <div class="wp-brand-mark" style="width:56px;height:56px;border-radius:16px;font-size:1.6rem;">
        <i class="bi bi-tree"></i>
      </div>
    </div>

    <div class="wp-error-code" style="color:var(--wp-emerald);">404</div>

    <h1 style="font-size:1.6rem;font-weight:800;color:var(--wp-ink);
               margin:16px 0 10px;letter-spacing:-0.02em;">
      Page introuvable
    </h1>
    <p style="color:var(--wp-muted);font-size:.93rem;line-height:1.6;margin-bottom:2rem;">
      Cette page n'existe pas ou a été déplacée.
      Vérifiez l'adresse ou revenez au tableau de bord.
    </p>

    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="javascript:history.back()"
         class="btn btn-outline-secondary d-flex align-items-center gap-2">
        <i class="bi bi-arrow-left"></i> Retour
      </a>
      <a href="/" class="btn btn-primary d-flex align-items-center gap-2">
        <i class="bi bi-house"></i> Accueil
      </a>
    </div>

  </div>
</div>
<script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
