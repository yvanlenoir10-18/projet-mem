<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Erreur serveur · WoodPilot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="wp-error-page">
  <div style="max-width:480px;padding:2rem;">

    <div style="display:flex;justify-content:center;margin-bottom:2rem;">
      <div style="width:56px;height:56px;border-radius:16px;
                  background:rgba(216,113,73,0.12);
                  display:flex;align-items:center;justify-content:center;
                  font-size:1.6rem;color:var(--wp-terracotta);">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
    </div>

    <div class="wp-error-code" style="color:var(--wp-terracotta);">500</div>

    <h1 style="font-size:1.6rem;font-weight:800;color:var(--wp-ink);
               margin:16px 0 10px;letter-spacing:-0.02em;">
      Quelque chose a cassé
    </h1>
    <p style="color:var(--wp-muted);font-size:.93rem;line-height:1.6;margin-bottom:2rem;">
      Une erreur inattendue s'est produite côté serveur.
      L'équipe technique a été notifiée. Veuillez réessayer ou revenir à l'accueil.
    </p>

    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="javascript:history.back()"
         class="btn btn-outline-secondary d-flex align-items-center gap-2">
        <i class="bi bi-arrow-left"></i> Retour
      </a>
      <a href="/" class="btn btn-primary d-flex align-items-center gap-2">
        <i class="bi bi-house"></i> Accueil
      </a>
    </div>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
